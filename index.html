<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกค่าใช้จ่ายสร้างบ้าน</title>
  
  <!-- Font Kanit & Tailwind CSS CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Anime.js & Chart.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="pb-24 text-slate-800 min-h-screen">

  <!-- Header Section -->
  <header class="bg-indigo-600 text-white p-5 shadow-lg rounded-b-3xl">
    <div class="max-w-md mx-auto">
      <div class="flex justify-between items-center mb-4">
        <h1 class="text-xl font-bold flex items-center gap-2">
          <span>🏡</span> บันทึกค่าสร้างบ้าน
        </h1>
        <button id="btnOpenBudgetModal" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full border border-white/30 flex items-center gap-1 transition-all">
          ⚙️ ตั้งค่างบประมาณ
        </button>
      </div>
      
      <!-- Summary Cards -->
      <div class="grid grid-cols-2 gap-3 mt-2">
        <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20">
          <p class="text-indigo-200 text-xs">งบประมาณรวม</p>
          <p class="text-lg font-bold mt-1 text-white" id="totalBudget">฿0</p>
        </div>
        <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20">
          <p class="text-indigo-200 text-xs">จ่ายไปแล้วทั้งหมด</p>
          <p class="text-lg font-bold mt-1 text-amber-300" id="totalExpenses">฿0</p>
        </div>
      </div>

      <!-- Budget Progress Bar -->
      <div class="mt-4 bg-black/20 rounded-full h-2.5 overflow-hidden">
        <div id="budgetProgressBar" class="bg-amber-400 h-full w-0 transition-all duration-500 rounded-full"></div>
      </div>
      <div class="flex justify-between text-[10px] text-indigo-200 mt-1">
        <span id="budgetPercentText">ใช้ไป 0%</span>
        <span id="budgetRemainingText">คงเหลือ ฿0</span>
      </div>
    </div>
  </header>

  <!-- Content Section -->
  <main class="max-w-md mx-auto p-4 space-y-5">
    
    <!-- Expense Chart Section -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100" id="chartCard">
      <h2 class="text-sm font-semibold mb-3 text-slate-700 flex items-center gap-2">
        📊 สัดส่วนค่าใช้จ่ายตามหมวดหมู่
      </h2>
      <div class="relative h-48 flex justify-center items-center">
        <canvas id="expenseChart"></canvas>
      </div>
    </section>

    <!-- Form Section -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100" id="formCard">
      <h2 class="text-base font-semibold mb-3 text-slate-700 flex items-center gap-2">
        ➕ บันทึกรายการใหม่
      </h2>
      <form id="expenseForm" class="space-y-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1">หมวดหมู่</label>
          <select id="category" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="ค่าแรง">👷 ค่าแรงช่าง / ผู้รับเหมา</option>
            <option value="โครงสร้าง">🏗️ โครงสร้าง / ปูน / เหล็ก</option>
            <option value="ตกแต่ง">🎨 ตกแต่ง / สี / เฟอร์นิเจอร์</option>
            <option value="ระบบน้ำไฟ">⚡ ระบบไฟฟ้า / ประปา</option>
            <option value="อื่นๆ">📦 ค่าใช้จ่ายอื่นๆ</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">รายละเอียดรายการ</label>
          <input type="text" id="title" placeholder="เช่น ค่าแรงช่างงวดที่ 1, สีกระเบื้อง" required class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">จำนวนเงิน (บาท)</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01" required class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white py-3 rounded-xl font-medium text-sm transition-all duration-200 shadow-md shadow-indigo-200 flex items-center justify-center gap-2">
          <span>บันทึกลงชีต</span>
        </button>
      </form>
    </section>

    <!-- Recent Expenses List -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h3 class="text-sm font-semibold text-slate-600">ประวัติรายการ</h3>
        <span class="text-xs text-slate-400" id="itemCount">0 รายการ</span>
      </div>
      
      <div id="expenseList" class="space-y-2.5">
        <!-- Dynamic Items populated by JS -->
      </div>
    </section>
  </main>

  <!-- Modal ตั้งค่างบประมาณ -->
  <div id="budgetModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-4">
      <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
        ⚙️ ตั้งค่างบประมาณสร้างบ้าน
      </h3>
      <div>
        <label class="block text-xs text-slate-500 mb-1">จำนวนเงินงบประมาณรวม (บาท)</label>
        <input type="number" id="inputBudget" placeholder="เช่น 2500000" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="flex gap-2">
        <button id="btnCancelBudget" class="w-1/2 bg-slate-100 text-slate-600 py-2.5 rounded-xl text-sm font-medium">ยกเลิก</button>
        <button id="btnSaveBudget" class="w-1/2 bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-medium shadow-md shadow-indigo-200">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- JavaScript & App Logic -->
  <script>
    const WEB_APP_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';

    // ไอคอน SVG แยกตามหมวดหมู่
    const CATEGORY_ICONS = {
      'ค่าแรง': `<svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>`,
      'โครงสร้าง': `<svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h4m-4 0H7"></path></svg>`,
      'ตกแต่ง': `<svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>`,
      'ระบบน้ำไฟ': `<svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`,
      'อื่นๆ': `<svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>`
    };

    let totalBudgetVal = localStorage.getItem('house_budget') ? parseFloat(localStorage.getItem('house_budget')) : 2500000;
    let categoryTotals = { 'ค่าแรง': 0, 'โครงสร้าง': 0, 'ตกแต่ง': 0, 'ระบบน้ำไฟ': 0, 'อื่นๆ': 0 };
    let totalExpenseVal = 0;
    let expenseChart = null;

    document.addEventListener('DOMContentLoaded', () => {
      // Entrance Animation
      anime({
        targets: ['header', '#chartCard', '#formCard'],
        translateY: [-15, 0],
        opacity: [0, 1],
        delay: anime.stagger(100),
        duration: 600,
        easing: 'easeOutQuad'
      document.addEventListener('DOMContentLoaded', () => {
      // Entrance Animation
      anime({
        targets: ['header', '#chartCard', '#formCard'],
        translateY: [-15, 0],
        opacity: [0, 1],
        delay: anime.stagger(100),
        duration: 600,
        easing: 'easeOutQuad'
      });

      initChart();
      loadDataFromSheet(); // ดึงข้อมูลจาก Google Sheet ทันทีที่เปิดหน้าเว็บ
    });

    // ฟังก์ชันดึงข้อมูลจาก Google Sheet มาแสดงผล
    async function loadDataFromSheet() {
      if (WEB_APP_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') return;

      const listContainer = document.getElementById('expenseList');
      listContainer.innerHTML = '<p class="text-xs text-center text-slate-400 py-4">กำลังโหลดข้อมูลจาก Google Sheet...</p>';

      try {
        const res = await fetch(WEB_APP_URL);
        const data = await res.json();

        // รีเซ็ตค่าเพื่อคำนวณใหม่
        totalExpenseVal = data.totalExpense || 0;
        categoryTotals = { 'ค่าแรง': 0, 'โครงสร้าง': 0, 'ตกแต่ง': 0, 'ระบบน้ำไฟ': 0, 'อื่นๆ': 0 };
        listContainer.innerHTML = '';

        if (data.expenses && data.expenses.length > 0) {
          document.getElementById('itemCount').innerText = `${data.expenses.length} รายการ`;
          
          data.expenses.forEach(item => {
            // บวกยอดแยกตามหมวดหมู่ทำกราฟ
            if (categoryTotals.hasOwnProperty(item.category)) {
              categoryTotals[item.category] += item.amount;
            } else {
              categoryTotals['อื่นๆ'] += item.amount;
            }

            // เพิ่มรายการลงหน้าเว็บ
            renderExpenseItem(item);
          });
        } else {
          listContainer.innerHTML = '<p class="text-xs text-center text-slate-400 py-4">ยังไม่มีรายการบันทึก</p>';
          document.getElementById('itemCount').innerText = `0 รายการ`;
        }

        updateBudgetUI();
        updateChart();

      } catch (err) {
        console.error('Fetch error:', err);
        listContainer.innerHTML = '<p class="text-xs text-center text-red-400 py-4">ไม่สามารถโหลดข้อมูลได้</p>';
      }
    }

    function renderExpenseItem(item) {
      const list = document.getElementById('expenseList');
      const div = document.createElement('div');
      div.className = 'bg-white p-3.5 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center';
      
      const iconSVG = CATEGORY_ICONS[item.category] || CATEGORY_ICONS['อื่นๆ'];

      div.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center">
            ${iconSVG}
          </div>
          <div>
            <p class="text-sm font-semibold text-slate-800">${item.title}</p>
            <p class="text-xs text-slate-400">${item.category} • ${item.date}</p>
          </div>
        </div>
        <p class="text-sm font-bold text-slate-700">฿${Number(item.amount).toLocaleString()}</p>
      `;

      list.appendChild(div);
    }
        if (WEB_APP_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
          await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        // อัปเดตยอดรวมและกราฟ
        totalExpenseVal += amount;
        categoryTotals[cat] = (categoryTotals[cat] || 0) + amount;
        
        updateBudgetUI();
        updateChart();
        addExpenseToList(payload);

        document.getElementById('expenseForm').reset();
      } catch (err) {
        console.error('Save error:', err);
      } finally {
        btn.disabled = false;
        btn.innerText = 'บันทึกลงชีต';
      }
    });

    function addExpenseToList(item) {
      const list = document.getElementById('expenseList');
      const div = document.createElement('div');
      div.className = 'bg-white p-3.5 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center opacity-0';
      
      const iconSVG = CATEGORY_ICONS[item.category] || CATEGORY_ICONS['อื่นๆ'];

      div.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center">
            ${iconSVG}
          </div>
          <div>
            <p class="text-sm font-semibold text-slate-800">${item.title}</p>
            <p class="text-xs text-slate-400">${item.category} • ${item.date}</p>
          </div>
        </div>
        <p class="text-sm font-bold text-slate-700">฿${Number(item.amount).toLocaleString()}</p>
      `;

      list.prepend(div);

      anime({
        targets: div,
        translateX: [-20, 0],
        opacity: [0, 1],
        duration: 400,
        easing: 'easeOutCubic'
      });
    }
  </script>
</body>
</html>
