<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกค่าใช้จ่ายสร้างบ้าน</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="pb-24 text-slate-800 min-h-screen">

  <!-- Header Section -->
  <header class="bg-indigo-600 text-white p-5 shadow-lg rounded-b-3xl">
    <div class="max-w-md mx-auto">
      <div class="flex justify-between items-center mb-4">
        <h1 class="text-xl font-bold flex items-center gap-2">
          <span>🏡</span> บันทึกค่าสร้างบ้าน
        </h1>
        <button id="btnOpenBudgetModal" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full border border-white/30 flex items-center gap-1 transition-all">
          ⚙️ ตั้งค่างบประมาณ
        </button>
      </div>
      
      <!-- Summary Cards -->
      <div class="grid grid-cols-2 gap-3 mt-2">
        <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20">
          <p class="text-indigo-200 text-xs">งบประมาณรวม</p>
          <p class="text-lg font-bold mt-1 text-white" id="totalBudget">฿0</p>
        </div>
        <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20">
          <p class="text-indigo-200 text-xs">จ่ายไปแล้วทั้งหมด</p>
          <p class="text-lg font-bold mt-1 text-amber-300" id="totalExpenses">฿0</p>
        </div>
      </div>

      <!-- Budget Progress Bar -->
      <div class="mt-4 bg-black/20 rounded-full h-2.5 overflow-hidden">
        <div id="budgetProgressBar" class="bg-amber-400 h-full w-0 transition-all duration-500 rounded-full"></div>
      </div>
      <div class="flex justify-between text-[10px] text-indigo-200 mt-1">
        <span id="budgetPercentText">ใช้ไป 0%</span>
        <span id="budgetRemainingText">คงเหลือ ฿0</span>
      </div>
    </div>
  </header>

  <!-- Content Section -->
  <main class="max-w-md mx-auto p-4 space-y-5">
    
    <!-- Expense Chart Section -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100" id="chartCard">
      <h2 class="text-sm font-semibold mb-3 text-slate-700 flex items-center gap-2">
        📊 สัดส่วนค่าใช้จ่ายตามหมวดหมู่
      </h2>
      <div class="relative h-48 flex justify-center items-center">
        <canvas id="expenseChart"></canvas>
      </div>
    </section>

    <!-- Form Section -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100" id="formCard">
      <h2 class="text-base font-semibold mb-3 text-slate-70
